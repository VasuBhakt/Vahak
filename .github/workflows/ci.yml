name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Chaos Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run Unit & Race Tests
        run: |
          go test -v -race ./internal/...

      - name: Run Kill -9 Crash Recovery Proof Test
        run: |
          go test -v -timeout 120s ./tests/chaos/...
